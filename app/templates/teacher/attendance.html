{% extends "base.html" %}

{% block content %}
<div class="container">
    <!-- Self Attendance Card -->
    <div class="card mb-4">
        <div class="card-header">
            <h3 class="mb-0">Mark Self Attendance</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="date" value="{{ today }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control" name="remarks"></textarea>
                </div>

                <button type="submit" name="mark_self_attendance" class="btn btn-primary">Mark Self Attendance</button>
            </form>
        </div>
    </div>

    <!-- Student Attendance Card -->
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">Mark Student Attendance</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="date" value="{{ today }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Students</label>
                    {% for student in students %}
                    <div class="row mb-2 align-items-center">
                        <div class="col-md-4">
                            <input type="checkbox" name="students" value="{{ student.id }}" id="student{{ student.id }}">
                            <label for="student{{ student.id }}">
                                {{ student.first_name }} {{ student.last_name }}
                            </label>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="status_{{ student.id }}">
                                <option value="present" {% if attendance_dict.get(student.id) == 'present' %}selected{% endif %}>Present</option>
                                <option value="absent" {% if attendance_dict.get(student.id) == 'absent' %}selected{% endif %}>Absent</option>
                                <option value="late" {% if attendance_dict.get(student.id) == 'late' %}selected{% endif %}>Late</option>
                            </select>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control" name="remarks"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit Student Attendance</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
