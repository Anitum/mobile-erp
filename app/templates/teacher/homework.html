{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">Assign Homework</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <select class="form-select" name="subject" required>
                        <option value="" disabled selected>Select a subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.value }}">{{ subject.value }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="datetime-local" class="form-control" name="due_date" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Attachment</label>
                    <input type="file" class="form-control" name="file">
                </div>

                <button type="submit" class="btn btn-primary">Assign Homework</button>
            </form>
        </div>
    </div>

    <!-- List of assigned homework -->
    <div class="card mt-4">
        <div class="card-header">
            <h3 class="mb-0">Assigned Homework</h3>
        </div>
        <div class="card-body" style="display: flex; justify-content: space-between; align-items: center;">
            {% for homework in assigned_homework %}
            <div class="mb-3">
                <h5>{{ homework.title }}</h5>
                <p style="max-width: 70%;">{{ homework.description }}</p>
                <p>Due Date: {{ homework.due_date.strftime('%Y-%m-%d %H:%M') }}</p>
            </div>
            <div class="mb-3">
                <a href="{{ url_for('static', filename=homework.file_path) }}" 
                   class="btn btn-sm btn-secondary" target="_blank">
                    <i class="fas fa-download"></i> Download
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
