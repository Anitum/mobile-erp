{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Submit Homework: {{ homework.title }}</h5>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Upload Files</label>
                    <input type="file" class="form-control" name="homework_files" multiple required>
                    <small class="text-muted">You can select multiple files (Max 5 files, 10MB each)</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Comments</label>
                    <textarea class="form-control" name="comments" rows="3"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('student.homework_list') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Homework</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
